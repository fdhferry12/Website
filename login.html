<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mini Greenhouse Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f0f4f8 100%);
            position: relative;
        }

        /* ========== DECORATIVE BACKGROUND ELEMENTS ========== */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 119, 255, 0.04);
        }

        .bg-circle:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -150px;
            animation: float-circle 20s ease-in-out infinite;
        }

        .bg-circle:nth-child(2) {
            width: 350px;
            height: 350px;
            bottom: -100px;
            left: -100px;
            background: rgba(0, 119, 255, 0.03);
            animation: float-circle 25s ease-in-out infinite reverse;
        }

        .bg-circle:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 119, 255, 0.02);
            animation: pulse-circle 15s ease-in-out infinite;
        }

        @keyframes float-circle {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -30px); }
            66% { transform: translate(-20px, 20px); }
        }

        @keyframes pulse-circle {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.1; }
        }

        /* ========== LOGIN CONTAINER ========== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== LOGIN CARD ========== */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 40px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(0, 119, 255, 0.05);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(0, 119, 255, 0.08);
        }

        /* ========== LOGO WRAPPER - UKURAN DIPERBESAR ========== */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .logo-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            padding: 8px;
            background: #ffffff;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .logo-item:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 12px;
            padding: 10px;
            background: white;
            display: block;
            image-rendering: auto;
            image-rendering: crisp-edges;
        }

        /* ========== UKURAN LOGO RESPONSIVE ========== */
        @media (max-width: 480px) {
            .logo-img {
                width: 90px;
                height: 90px;
                padding: 8px;
            }

            .logo-wrapper {
                gap: 20px;
            }
        }

        @media (max-width: 360px) {
            .logo-img {
                width: 75px;
                height: 75px;
                padding: 6px;
            }

            .logo-wrapper {
                gap: 15px;
            }
        }

        .logo-divider {
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, transparent, #c0d0e0, transparent);
            flex-shrink: 0;
        }

        /* ========== HEADER ========== */
        .login-header {
            margin-bottom: 28px;
        }

        .login-header h1 {
            color: #1a1a2e;
            font-size: 24px;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
            animation: slideInLeft 0.6s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .login-header .subtitle {
            color: #667;
            font-size: 14px;
            font-weight: 500;
            animation: slideInRight 0.6s ease-out 0.2s both;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .login-header .subtitle .highlight {
            color: #0077ff;
            font-weight: 600;
        }

        /* ========== INPUT GROUP ========== */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 13px;
            transition: color 0.3s;
        }

        .input-group label i {
            margin-right: 8px;
            color: #0077ff;
            width: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafbfc;
            color: #333;
            font-weight: 500;
        }

        .input-group input:focus {
            border-color: #0077ff;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 119, 255, 0.06);
        }

        .input-group input::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        .input-group.focused label {
            color: #0077ff;
        }

        /* ========== PASSWORD TOGGLE ========== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 17px;
            padding: 5px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #0077ff;
        }

        /* ========== ERROR MESSAGE ========== */
        .error-message {
            color: #ff4757;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            padding: 8px 14px;
            background: rgba(255, 71, 87, 0.05);
            border-radius: 10px;
            border-left: 3px solid #ff4757;
            animation: shake 0.5s ease;
        }

        .error-message i {
            margin-right: 8px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        /* ========== BUTTON ========== */
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            margin-top: 8px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #0077ff, #0066dd);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.4s both;
            letter-spacing: 0.5px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 119, 255, 0.25);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn i {
            margin-right: 10px;
            transition: transform 0.3s ease;
        }

        .login-btn:hover i {
            transform: translateX(5px);
        }

        /* ========== LOADING SPINNER ========== */
        .btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-loading .btn-text {
            display: none;
        }

        .btn-loading .btn-spinner {
            display: inline-block;
        }

        .btn-spinner {
            display: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== FOOTER ========== */
        .login-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eef2f7;
            font-size: 13px;
            color: #8899aa;
            animation: fadeInUp 0.6s ease-out 0.5s both;
            line-height: 1.8;
        }

        .login-footer p {
            margin: 2px 0;
        }

        .login-footer .footer-title {
            font-weight: 600;
            color: #556;
        }

        /* ========== LOADING OVERLAY ========== */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-content {
            text-align: center;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 119, 255, 0.1);
            border-radius: 50%;
            border-top-color: #0077ff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        /* Icon loading disembunyikan */
        .loading-content .loading-icon {
            display: none;
        }

        @keyframes pulse-icon {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 600;
            margin-top: 10px;
            color: #1a1a2e;
            letter-spacing: 1px;
        }

        .loading-subtext {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px 20px;
                border-radius: 20px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .login-header .subtitle {
                font-size: 12px;
            }

            .input-group input {
                padding: 10px 14px;
                font-size: 14px;
            }

            .login-btn {
                padding: 12px;
                font-size: 14px;
            }

            .login-footer {
                font-size: 11px;
            }

            .logo-divider {
                height: 60px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 20px 15px 18px;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #0077ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>
    <!-- ========== DECORATIVE BACKGROUND ========== -->
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- ========== LOADING OVERLAY ========== -->
    <div id="loadingOverlay">
        <div class="loading-content">
            <!-- Icon microchip dihilangkan -->
            <!-- <div class="loading-icon">
                <i class="fas fa-microchip"></i>
            </div> -->
            <div class="loading-spinner"></div>
            <div class="loading-text">Memuat Dashboard...</div>
            <div class="loading-subtext">Mohon tunggu sebentar</div>
        </div>
    </div>

    <!-- ========== LOGIN CONTAINER ========== -->
    <div class="login-container">
        <div class="login-card">
            <!-- LOGO - UKURAN DIPERBESAR -->
            <div class="logo-wrapper">
                <!-- Logo Polinema -->
                <div class="logo-item">
                    <img src="Logo_Politeknik_Negeri_Malang.png" alt="Logo Polinema" class="logo-img">
                </div>

                <!-- Pemisah -->
                <div class="logo-divider"></div>

                <!-- Logo Teknik Elektro -->
                <div class="logo-item">
                    <img src="Logo_Teknik_Elektro.png" alt="Logo Teknik Elektro" class="logo-img">
                </div>
            </div>

            <!-- HEADER -->
            <div class="login-header">
                <h1>Web Dashboard Monitoring</h1>
                <p class="subtitle">
                    Mini Greenhouse <span class="highlight">Control System</span>
                </p>
            </div>

            <!-- FORM -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" required placeholder="Masukkan username" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Masukkan password" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    Username atau password salah!
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span class="btn-text">Masuk</span>
                    <span class="btn-spinner">
                        <div class="spinner"></div>
                    </span>
                </button>

                <div class="login-footer">
                    <p>
                        <span class="footer-title">Sistem Monitoring Real Time Pada Mini Greenhouse</span>
                    </p>
                    <p>
                        Jurusan Teknik Elektro - Politeknik Negeri Malang
                    </p>
                    <p style="margin-top: 6px; font-size: 12px; opacity: 0.6;">
                        Tugas Akhir 2026
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // VALID USERS DATA
        // ==========================================
        const validUsers = [
            { username: 'user', password: 'user123' },
            // Tambahkan user lain jika diperlukan
        ];

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // ==========================================
        // FOCUS ANIMATION
        // ==========================================
        document.querySelectorAll('.input-group input').forEach(input => {
            const group = input.closest('.input-group');
            
            input.addEventListener('focus', () => {
                group.classList.add('focused');
            });
            
            input.addEventListener('blur', () => {
                if (!input.value) {
                    group.classList.remove('focused');
                }
            });
            
            // Check if input has value on load
            if (input.value) {
                group.classList.add('focused');
            }
        });

        // ==========================================
        // PASSWORD TOGGLE VISIBILITY
        // ==========================================
        let passwordVisible = false;
        
        togglePasswordBtn.addEventListener('click', function() {
            passwordVisible = !passwordVisible;
            const icon = this.querySelector('i');
            
            if (passwordVisible) {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ==========================================
        // LOGIN FORM HANDLER
        // ==========================================
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Hide previous error
            errorMessage.style.display = 'none';
            
            // Validasi input kosong
            if (!username || !password) {
                showError('Username dan password harus diisi!');
                return;
            }
            
            // Cek user valid
            const isValidUser = validUsers.some(user => 
                user.username === username && user.password === password
            );
            
            if (isValidUser) {
                // Disable button & show loading state
                loginBtn.classList.add('btn-loading');
                loginBtn.disabled = true;
                
                // Simpan data login
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                
                // Tampilkan loading overlay dengan delay
                setTimeout(() => {
                    loadingOverlay.style.display = 'flex';
                }, 300);
                
                // Redirect ke dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } else {
                showError('Username atau password salah!');
                
                // Shake animation on card
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                setTimeout(() => {
                    card.style.animation = 'shake 0.5s ease';
                }, 10);
                
                // Reset animasi setelah selesai
                setTimeout(() => {
                    card.style.animation = '';
                }, 600);
                
                // Clear password field
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // ==========================================
        // SHOW ERROR FUNCTION
        // ==========================================
        function showError(message) {
            errorMessage.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            errorMessage.style.display = 'block';
        }

        // ==========================================
        // ENTER KEY SUPPORT
        // ==========================================
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        // ==========================================
        // CLEAR ERROR ON INPUT
        // ==========================================
        usernameInput.addEventListener('input', () => {
            errorMessage.style.display = 'none';
        });
        
        passwordInput.addEventListener('input', () => {
            errorMessage.style.display = 'none';
        });

        console.log('🚀 Login page loaded successfully!');
        console.log('👤 Valid users:', validUsers.map(u => u.username).join(', '));
    </script>
</body>
</html>
